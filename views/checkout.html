<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopNow</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand">ShopNow</a>
      <div class="navbar-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/cart.html" class="nav-link">
          Cart
          <span class="cart-count">0</span>
        </a>
        <div id="auth-links">
          <a href="/auth.html" class="nav-link">Login/Register</a>
        </div>
      </div>
    </div>
  </nav>

  <section class="checkout-section">
    <div class="container">
      <h1 class="section-title">Checkout</h1>
      <div class="checkout-container">
        <div class="checkout-form-container">
          <h2 style="margin-bottom: 1.5rem;">Shipping Address</h2>
          
          <div id="addresses-container" style="margin-bottom: 1.5rem;"></div>
          
          <h3 style="margin-bottom: 1rem;">Add New Address</h3>
          <div class="form-group">
            <label class="form-label" for="fullName">Full Name</label>
            <input type="text" id="fullName" class="form-input" placeholder="Enter full name" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="addressLine1">Address Line 1</label>
            <input type="text" id="addressLine1" class="form-input" placeholder="Street address" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="addressLine2">Address Line 2 (Optional)</label>
            <input type="text" id="addressLine2" class="form-input" placeholder="Apartment, suite, etc.">
          </div>
          <div class="form-group">
            <label class="form-label" for="city">City</label>
            <input type="text" id="city" class="form-input" placeholder="City" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="state">State</label>
            <input type="text" id="state" class="form-input" placeholder="State" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="zipCode">ZIP Code</label>
            <input type="text" id="zipCode" class="form-input" placeholder="ZIP code" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input type="tel" id="phone" class="form-input" placeholder="Phone number" required>
          </div>
          <button class="btn btn-primary" style="margin-bottom: 1rem;" onclick="saveAddress()">Save Address</button>
        </div>
        
        <div class="checkout-summary">
          <h2 style="margin-bottom: 1.5rem;">Order Summary</h2>
          <div id="checkout-summary-items"></div>
          <div class="cart-total">
            <span class="cart-total-label">Total:</span>
            <span class="cart-total-amount" id="checkout-summary-total">$0.00</span>
          </div>
          <button class="btn btn-success" style="width: 100%; margin-top: 1.5rem;" onclick="proceedToFinal()">Proceed to Payment</button>
        </div>
      </div>
    </div>
  </section>

  <script src="/js/app.js"></script>
</body>
</html>
