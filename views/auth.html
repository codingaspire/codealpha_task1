<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login/Register - ShopNow</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <nav class="navbar">
    <div class="container">
      <a href="/" class="navbar-brand">ShopNow</a>
      <div class="navbar-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/cart.html" class="nav-link">
          Cart
          <span class="cart-count">0</span>
        </a>
      </div>
    </div>
  </nav>

  <section class="auth-section">
    <div class="auth-container">
      <div class="auth-tabs">
        <button class="auth-tab active" id="login-tab">Login</button>
        <button class="auth-tab" id="register-tab">Register</button>
      </div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="password-input-group">
            <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('login-password', this)">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <form id="register-form" class="auth-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="register-name">Name</label>
          <input type="text" id="register-name" class="form-input" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="register-email">Email</label>
          <input type="email" id="register-email" class="form-input" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="register-password">Password</label>
          <div class="password-input-group">
            <input type="password" id="register-password" class="form-input" placeholder="Create a password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('register-password', this)">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="register-confirm-password">Confirm Password</label>
          <div class="password-input-group">
            <input type="password" id="register-confirm-password" class="form-input" placeholder="Confirm your password" required>
            <button type="button" class="password-toggle" onclick="togglePassword('register-confirm-password', this)">👁️</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
    </div>
  </section>

  <script src="/js/app.js"></script>
</body>
</html>
